global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Use container name (same as BACKEND_DESTINATION_HOST); service name "backend" may not resolve in some Docker setups.
scrape_configs:
  - job_name: "backend-metrics"
    static_configs:
      - targets: ["pluto-next_backend_1:7676"]
    metrics_path: "/metrics"
