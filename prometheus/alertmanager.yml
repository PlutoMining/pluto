# Alertmanager config for Pluto. Sends alerts to backend webhook.
# Backend port: 7776 (dev/stable), 7676 (next).
global:
  resolve_timeout: 5m

route:
  receiver: pluto-webhook
  group_by: [alertname, device_mac]
  group_wait: 30s
  group_interval: 5m
  # How often to re-send the same firing alert (default 4h). Lower = more reminders while condition stays broken.
  repeat_interval: 15m

receivers:
  - name: pluto-webhook
    webhook_configs:
      - url: "http://backend:7776/alerts/alertmanager"
        send_resolved: true
